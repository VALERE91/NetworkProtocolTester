name: Build and Release

on:
  push:
    tags:
      - "v*" # Trigger on tags like v1.0.0, v0.1.0-alpha, etc.
  workflow_dispatch: # Allows manual triggering from the Actions tab

env:
  CARGO_TERM_COLOR: always
  BINARY_NAME: network_protocol_tester

jobs:
  build:
    name: Build ${{ matrix.platform }} (${{ matrix.target }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          # Linux x64
          - os: ubuntu-latest
            platform: linux
            target: x86_64-unknown-linux-gnu
            binary_ext: ""

          # Windows x64
          - os: windows-latest
            platform: windows
            target: x86_64-pc-windows-msvc
            binary_ext: ".exe"

          # MacOS ARM64 (Apple Silicon)
          - os: macos-latest
            platform: macos-arm64
            target: aarch64-apple-darwin
            binary_ext: ""

          # MacOS Intel (Legacy)
          - os: macos-latest
            platform: macos-intel
            target: x86_64-apple-darwin
            binary_ext: ""

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Install Rust Toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}

      - name: Build Binary
        run: cargo build --release --target ${{ matrix.target }}

      - name: Organize Artifacts
        shell: bash
        run: |
          mkdir -p dist
          # Move the compiled binary to a dist/ folder with a unique name
          cp target/${{ matrix.target }}/release/${{ env.BINARY_NAME }}${{ matrix.binary_ext }} dist/${{ env.BINARY_NAME }}-${{ matrix.platform }}${{ matrix.binary_ext }}

      - name: Upload Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: binary-${{ matrix.platform }}
          path: dist/*
          if-no-files-found: error