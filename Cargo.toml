[package]
name = "network_protocol_tester"
version = "0.1.0"
edition = "2024"

[dependencies]
anyhow = "1"
thiserror = "2"
async-trait = "0.1"
clap = { version = "4", features = ["derive"] }
tokio = { version = "1", features = ["full"] }
serde = { version = "1", features = ["derive"] }
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter", "fmt", "tracing-log"] }
rustls = { version = "0.23", features = ["ring"] }
bincode = "2"
quinn = "0.11.9"
rcgen = "0.14.5"
rand = "0.9.2"
rusty_enet = "0.4.0"
indicatif = "0.18.2"
serde_json = "1.0.145"